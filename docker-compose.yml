services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: love-v3
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/uploads/memories
    ports:
      - '3000:3000'
    volumes:
      - ./data:/app/data
      - ./uploads/memories:/app/uploads/memories
    restart: unless-stopped
